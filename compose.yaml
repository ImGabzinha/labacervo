services:
  banco:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: labacervo
      MYSQL_USER: lab
      MYSQL_PASSWORD: lab_demo
      MYSQL_ROOT_PASSWORD: root_local_demo
    volumes:
      - dados:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -ulab -plab_demo labacervo -e 'SELECT 1'"]
      interval: 5s
      timeout: 4s
      retries: 30
  api:
    build: .
    environment:
      DB_URL: jdbc:mysql://banco:3306/labacervo?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      banco:
        condition: service_healthy
volumes:
  dados:
