spring.application.name=labacervo
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/labacervo?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:lab}
spring.datasource.password=${DB_PASSWORD:lab_demo}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
lab.senha.consulta=${SENHA_CONSULTA:consulta_demo}
lab.senha.tecnico=${SENHA_TECNICO:tecnico_demo}
